name: Manual demonstration image publication
on:
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Public sample package name'
        type: choice
        options:
          - northstar-demo
        default: northstar-demo
permissions:
  contents: read
  packages: write
concurrency:
  group: platform-demo-image
  cancel-in-progress: false
jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and publish the sample image
        env:
          PACKAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
          PACKAGE_ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          package_owner="$(printf '%s' "$PACKAGE_OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/$package_owner/northstar-demo:$GITHUB_SHA"
          printf '%s' "$PACKAGE_TOKEN" | docker login ghcr.io --username "$PACKAGE_ACTOR" --password-stdin >/dev/null 2>&1
          docker build --platform linux/amd64 --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$image" demo
          docker push "$image"
          digest="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          printf 'Set DEMO_IMAGE to this immutable public sample image reference: %s\n' "$digest"
          printf 'Set the GHCR package visibility to public before App Service deployment.\n'
