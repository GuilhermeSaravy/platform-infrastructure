name: Manual configuration checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-infrastructure-checks
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Check logical declarations
        run: python3 scripts/check_config.py
      - name: Exercise rejected configuration and runtime input cases
        run: python3 -m unittest discover -s tests -p 'test_configuration.py'
      - name: Check Terraform source formatting
        run: terraform fmt -check -recursive
